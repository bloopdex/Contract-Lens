openapi: 3.0.3
info:
  title: Fixture API
  version: 1.0.0
paths:
  /users:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                name:
                  type: string
                role:
                  type: string
                  enum: [admin, editor]
                nickname:
                  type: string
      responses:
        '201':
          description: ok
