openapi: 3.0.3
info: {title: Users, version: 1.0.0}
paths:
  /users:
    get:
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/User'}
  /users/{userId}:
    get:
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
components:
  schemas:
    User:
      type: object
      required: [id]
      properties:
        id: {type: string}
        email: {type: string}
        address: {$ref: '#/components/schemas/Address'}
    Address:
      type: object
      properties:
        street: {type: string}
        city: {type: string}
