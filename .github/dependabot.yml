# Dependency-update automation. Version updates open PRs; every
# PR runs the full validation pipeline, so an unsafe update cannot land
# silently.
#
# All Gradle updates are grouped into ONE weekly PR (not one PR per
# dependency) so the review surface stays readable. Note (recorded
# policy): Dependabot cannot regenerate gradle/verification-metadata.xml,
# so a merged update PR still requires the maintainer to regenerate the
# metadata and re-verify before the strict CI gate goes green —
# see CONTRIBUTING.md.

version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
