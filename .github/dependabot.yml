# Dependency-update automation. Version updates open PRs; every
# PR runs the full validation pipeline, so an unsafe update cannot land
# silently. Activates once the repository is hosted (the workflows have
# the same precondition).

version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
