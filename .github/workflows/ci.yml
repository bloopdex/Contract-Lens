# CI architecture (docs/ci.md) — pull requests, pushes to master,
# and version-tag pushes (a tag runs the full validation; the
# publication itself runs ONLY in release.yml, which is
# exclusively tag-triggered).
#
# Two jobs on purpose, so the Actions tab stays readable:
#   - build-test: the correctness gate, as the 2x2 compatibility
#     matrix (both supported JVMs on both OSes).
#   - verify: the remaining gates as sequential steps — coverage,
#     strict dependency verification, OSV scan, fuzz smoke +
#     Jazzer replay, benchmark smoke. One job, one log to read;
#     the first failing step stops the rest and names itself.
#
# The expensive verification (long fuzz sweeps, coverage-guided
# fuzzing, full benchmark comparisons, action e2e) runs in
# nightly.yml. One run per ref at a time: a rapid series of pushes
# cancels the in-flight run and re-runs on the latest commit.

name: CI

on:
  push:
    # The repository's default branch is `master` — pushes there run
    # the full validation; version tags run it too.
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [17, 21]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, lint, and test
        run: ./gradlew build --console=plain

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Coverage gate (per-module line minimums)
        run: ./gradlew koverVerify --console=plain

      # Per-module reports: the root merge is empty when a source-less
      # subproject exists (:fuzz) — documented in docs/coverage.md.
      - name: Coverage reports (per module)
        run: ./gradlew koverXmlReport --console=plain

      - name: Upload the coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "*/build/reports/kover/report.xml"

      - name: Resolve dependencies against the committed verification metadata
        run: ./gradlew assemble --dependency-verification=strict --console=plain

      - name: OSV-Scanner (Gradle lockfiles)
        # The plain docker invocation, identical to the documented local
        # command (SECURITY.md): the upstream google/osv-scanner-action
        # wrapper is deliberately not used — it publishes no moving
        # major tag, and its v1.9.2 action.yml ships without a `runs:`
        # section, which fails the job at setup on GitHub's side.
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner scan --config=osv-scanner.toml -r .

      - name: Seeded harness smoke (parsers + classifier)
        run: ./gradlew :cli:fuzz -PfuzzIterations=5000 :core:fuzz -PfuzzIterations=5000 --console=plain

      - name: Jazzer crash-input replay (regression mode)
        run: ./gradlew :fuzz:jazzerFuzz --console=plain

      - name: Benchmark smoke (reduced runs, writes nothing)
        run: ./gradlew :benchmark:benchSmoke --console=plain
