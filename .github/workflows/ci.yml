# CI architecture (docs/ci.md) — pull requests, pushes to master,
# and version-tag pushes (a tag runs the full validation matrix;
# the publication itself runs ONLY in release.yml, which is
# exclusively tag-triggered). Every job below is BLOCKING; the
# expensive verification (long fuzz sweeps, coverage-guided
# fuzzing, full benchmark comparisons, action e2e) runs in
# nightly.yml.
#
# Job split rationale (measured locally, 2026-08-19):
#   - build+test: the full suite is the correctness gate; the 2x2
#     matrix (both supported JVMs on both OSes) is the original compatibility job
#     kept intact.
#   - coverage/lint: separate jobs make each failure diagnosable.
#   - security: dependency-verification strict + OSV scan (lockfiles
#     are committed, so the scan is reproducible — SECURITY.md).
#   - fuzz-smoke: the seeded harness at a small iteration count plus
#     Jazzer crash-input replay; the recorded 200k sweeps (39 min)
#     belong to the nightly job.
#   - benchmark-smoke: reduced timing runs that prove the harness and
#     fixtures still execute; comparisons against the committed
#     baseline belong to the nightly job.
#
# NOTE (honest): this workflow only executes once the repository is
# pushed to a GitHub host — no remote is configured yet (hosting is an
# open hosting decision). Every command here has been executed
# locally with the results recorded in docs/ci.md.

name: CI

on:
  push:
    # The repository's default branch is `master` — pushes there run
    # the full matrix; version tags run it too (publication itself is
    # release.yml, exclusively tag-triggered).
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [17, 21]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, lint, and test
        run: ./gradlew build --console=plain

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Coverage gate (per-module line minimums)
        run: ./gradlew koverVerify --console=plain

      # Per-module reports: the root merge is empty when a source-less
      # subproject exists (:fuzz) — documented in docs/coverage.md.
      - name: Coverage reports (per module)
        run: ./gradlew koverXmlReport --console=plain

      - name: Upload the coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "*/build/reports/kover/report.xml"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve dependencies against the committed verification metadata
        run: ./gradlew assemble --dependency-verification=strict --console=plain

      - name: OSV-Scanner (Gradle lockfiles)
        uses: google/osv-scanner-action@v1
        with:
          scan-args: |-
            --format=table
            --fail-on-vuln=true
            --config=osv-scanner.toml
            -r
            .

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Seeded harness smoke (parsers + classifier)
        run: ./gradlew :cli:fuzz -PfuzzIterations=5000 :core:fuzz -PfuzzIterations=5000 --console=plain

      - name: Jazzer crash-input replay (regression mode)
        run: ./gradlew :fuzz:jazzerFuzz --console=plain

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Benchmark smoke (reduced runs, writes nothing)
        run: ./gradlew :benchmark:benchSmoke --console=plain
